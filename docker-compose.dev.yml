services:
  db:
    image: postgis/postgis:16-3.4
    container_name: touch-grass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: touchgrass
      POSTGRES_PASSWORD: touchgrass
      POSTGRES_DB: touchgrass_dev
    ports:
      - "5252:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchgrass -d touchgrass_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: